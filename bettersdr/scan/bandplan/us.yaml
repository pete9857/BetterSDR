  - name: 6 m Amateur
    start_hz: 50_000_000
    end_hz: 54_000_000
    mode: usb
    bandwidth_hz: 3_000
    icon: ham
    colour: "#4a8a5a"
    description: >
      A band for licensed amateur radio operators, who are experimenting and
      talking to each other rather than broadcasting to the public.
    channels:
      - hz: 50_125_000
        name: SSB calling
        official: 6 m SSB calling frequency
        use: >
          Where operators call when the band opens. Quiet for weeks, then
          suddenly full of distant stations for an afternoon.
      - hz: 52_525_000
        name: FM calling
        official: 6 m FM calling frequency
        use: >
          The FM meeting point on this band. Set the mode to NFM to hear
          it.

