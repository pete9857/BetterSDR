# What the rest of the dial is licensed for.
#
# Everything above is somewhere a beginner can usefully point this receiver.
# This second list is the opposite: it covers the gaps between those bands, so
# that "Unallocated" can stop meaning "we have nothing to say about this" and
# start meaning "here is who owns it, and why you cannot hear it". It is shown
# from Standard upwards only - at Simple, a stretch of dial with nothing to
# listen to is better left quiet than explained.
#
# These entries deliberately carry no mode, bandwidth or raster. Nothing tunes
# from them, nothing scans them and the classifier does not read them; they are
# prose, and the only code that looks at them is `official()`.

allocations:
  - name: Beacons and travellers' information
    start_hz: 500_000
    end_hz: 530_000
    use: >
      Licensed to non-directional beacons - the low, steady tones aircraft and
      boats home in on, each identifying itself in morse - and to the
      low-power stations that read out road and parking information near
      airports.

  - name: Long-distance fixed links
    start_hz: 1_700_000
    end_hz: 1_800_000
    use: >
      Licensed to fixed and mobile services. Some countries continue the AM
      broadcast band up to 1710 kHz, so a station here is likely to be a
      distant one.

  - name: 160 m Amateur
    start_hz: 1_800_000
    end_hz: 2_000_000
    use: >
      Licensed to amateur radio operators. It comes alive after dark and is
      almost silent in daylight, and most of the work here is in single
      sideband or morse rather than AM.

  - name: Maritime radio
    start_hz: 2_000_000
    end_hz: 2_300_000
    use: >
      Licensed to ships and coast stations for long-distance work, including
      the 2182 kHz distress channel, plus fixed links.

  - name: Business and broadcast links
    start_hz: 26_100_000
    end_hz: 26_965_000
    use: >
      Licensed to low-power business radio and to remote pickup units - the
      link a radio station uses to get an outside broadcast back to the
      studio.

  - name: Business radio
    start_hz: 27_405_000
    end_hz: 28_000_000
    use: >
      Licensed to business radio, immediately above Citizens Band.

  - name: 10 m Amateur
    start_hz: 28_000_000
    end_hz: 29_700_000
    use: >
      Licensed to amateur radio operators. When the sun is active this band
      reaches around the world on a few watts; when it is not, it is empty for
      months.

  - name: VHF low band
    start_hz: 29_700_000
    end_hz: 50_000_000
    use: >
      Licensed to state police, forestry, utilities, public works and the
      military. Signals here bend over hills rather than needing line of
      sight, and occasionally arrive from a thousand miles away.

  - name: Television 2 to 4
    start_hz: 54_000_000
    end_hz: 72_000_000
    use: >
      Licensed to broadcast television. American stations left these channels
      when television went digital, so it is mostly empty.

  - name: Marker beacons and wireless links
    start_hz: 72_000_000
    end_hz: 76_000_000
    use: >
      Licensed to aircraft marker beacons at 75 MHz, which mark the approach
      to a runway, and to radio-controlled models, wireless microphones and
      industrial telemetry.

  - name: Television 5 and 6
    start_hz: 76_000_000
    end_hz: 88_000_000
    use: >
      Licensed to broadcast television, and almost as empty as channels 2 to 4
      for the same reason.

  - name: Guard band
    start_hz: 117_975_000
    end_hz: 118_000_000
    use: >
      Deliberately empty: a sliver kept clear between the navigation beacons
      below and the air traffic channels above, so that neither spills into
      the other.

  - name: Federal government
    start_hz: 138_000_000
    end_hz: 144_000_000
    use: >
      Licensed to federal agencies and the military for two-way radio, along
      with some satellite downlinks. Much of it is encrypted.

  - name: Federal government
    start_hz: 148_000_000
    end_hz: 150_800_000
    use: >
      Licensed to federal agencies and the military, with a slice at 150 MHz
      reserved for the satellites ships once navigated by.

  - name: Business and public safety
    start_hz: 150_800_000
    end_hz: 156_000_000
    use: >
      Licensed to taxis, tow trucks, utilities, vets, fire departments and
      paging transmitters. It is the busiest two-way band in the country, and
      the traffic on it is still largely in plain FM.

  - name: Federal government
    start_hz: 162_025_000
    end_hz: 162_400_000
    use: >
      Licensed to federal agencies, out of the same pool the weather radio
      channels immediately above come from. Land management, law enforcement
      and park services, and increasingly digital.

  - name: Television 7 to 13
    start_hz: 174_000_000
    end_hz: 216_000_000
    use: >
      Licensed to broadcast television, now digital, and to the wireless
      microphones used in theatres, churches and concert halls.

  - name: Maritime and vehicle tracking
    start_hz: 216_000_000
    end_hz: 222_000_000
    use: >
      Licensed to automated maritime telecommunications along the inland
      waterways, to vehicle location systems, and to narrowband business
      radio.

  - name: 1.25 m Amateur
    start_hz: 222_000_000
    end_hz: 225_000_000
    use: >
      Licensed to amateur radio operators. A quiet band with a scattering of
      repeaters, popular where the 2 metre band is crowded.

  - name: Federal government and satellites
    start_hz: 400_000_000
    end_hz: 420_000_000
    use: >
      Licensed to federal agencies: weather balloon telemetry around 403 MHz,
      distress beacons at 406 MHz, satellite links and government two-way
      radio.

  - name: Business radio
    start_hz: 450_000_000
    end_hz: 462_500_000
    use: >
      Licensed to business and public safety two-way radio - shops,
      warehouses, hospitals, security and taxi firms - much of it now digital.

  - name: Business radio
    start_hz: 467_725_000
    end_hz: 470_000_000
    use: >
      The upper half of the same business band, above the walkie-talkie
      channels.

  - name: Television 14 to 36
    start_hz: 470_000_000
    end_hz: 608_000_000
    use: >
      Licensed to digital broadcast television. A station here is several
      megahertz wide and carries no analogue sound at all, so it appears as a
      flat block on the waterfall and nothing on the speaker.

  - name: Radio astronomy
    start_hz: 608_000_000
    end_hz: 614_000_000
    use: >
      Reserved for radio telescopes and hospital telemetry. Nothing is
      licensed to transmit here, which is the point of it.

  - name: Mobile phones, 600 MHz
    start_hz: 614_000_000
    end_hz: 698_000_000
    use: >
      Licensed to mobile phone networks, which bought these channels from
      television broadcasters. The signal is digital and spread wide.

  - name: Mobile phones, 700 MHz
    start_hz: 698_000_000
    end_hz: 764_000_000
    use: >
      Licensed to mobile phone networks and, at the top end, to the national
      public safety network.

  - name: Mobile phones and trunked radio
    start_hz: 869_000_000
    end_hz: 902_000_000
    use: >
      Licensed to mobile phone networks and to the trunked radio systems taxi
      and delivery fleets use. Both are digital.

  - name: Paging control links
    start_hz: 928_000_000
    end_hz: 929_000_000
    use: >
      Licensed to the fixed links that feed paging transmitters, and to short
      microwave hops. This is the studio side of the pager channels just
      above.

  - name: Paging and trunked radio
    start_hz: 932_000_000
    end_hz: 941_000_000
    use: >
      Licensed to paging systems and business trunked radio, along with fixed
      links.

  - name: Studio to transmitter links
    start_hz: 941_000_000
    end_hz: 960_000_000
    use: >
      Licensed to the microwave links that carry a radio station's programme
      from its studio to its transmitter on the hill.

  # Split around the aircraft tracking band at 1090 MHz, which is a band of
  # its own. Nothing else changes across the join.
  - name: Aircraft navigation
    start_hz: 960_000_000
    end_hz: 1_089_000_000
    use: >
      Licensed to distance-measuring beacons, which aircraft interrogate and
      time the reply from, and to the position reports light aircraft send at
      978 MHz. All of it is short pulses rather than speech.

  - name: Aircraft navigation
    start_hz: 1_091_000_000
    end_hz: 1_164_000_000
    use: >
      Licensed to air traffic radar and to the beacons aircraft navigate by.
      The radar interrogates aircraft just below this, at 1030 MHz, and they
      answer on 1090 - which is the aircraft tracking band this app decodes.

  - name: Satellite navigation
    start_hz: 1_164_000_000
    end_hz: 1_240_000_000
    use: >
      Licensed to the satellite navigation systems - GPS and its European,
      Russian and Chinese equivalents. Their signals arrive below the noise
      floor and need a receiver built for them.

  - name: Air traffic radar
    start_hz: 1_300_000_000
    end_hz: 1_350_000_000
    use: >
      Licensed to the long-range radar that air traffic control sweeps the sky
      with, which is why an aerial near an airport sees regular pulses here.

  - name: Federal fixed and mobile
    start_hz: 1_350_000_000
    end_hz: 1_400_000_000
    use: >
      Licensed to military telemetry and government fixed links.

  - name: Radio astronomy
    start_hz: 1_400_000_000
    end_hz: 1_427_000_000
    use: >
      Protected worldwide, because hydrogen in space emits at 1420 MHz and
      this is the window astronomers listen to it through. No transmitting of
      any kind is allowed.

  - name: Telemetry and wireless microphones
    start_hz: 1_427_000_000
    end_hz: 1_518_000_000
    use: >
      Licensed to medical telemetry, professional wireless microphones and the
      telemetry aircraft manufacturers send down during flight testing.

  - name: Satellite telephones, downlink
    start_hz: 1_518_000_000
    end_hz: 1_559_000_000
    use: >
      Licensed to satellite telephone and data services on their way down to
      the ground, including the safety system ships at sea rely on.

  - name: Satellite navigation
    start_hz: 1_559_000_000
    end_hz: 1_610_000_000
    use: >
      Licensed to satellite navigation. This is where GPS itself transmits, at
      1575.42 MHz.

  - name: Satellite telephones, uplink
    start_hz: 1_610_000_000
    end_hz: 1_660_000_000
    use: >
      Licensed to satellite telephones talking back up to the satellite.
      Handsets around 1620 MHz are close enough and strong enough to be heard
      as short bursts.

  - name: Radio astronomy and weather balloons
    start_hz: 1_660_000_000
    end_hz: 1_670_000_000
    use: >
      Shared between radio telescopes and the radiosondes weather balloons
      carry aloft twice a day.

  - name: Weather satellites and mobile data
    start_hz: 1_670_000_000
    end_hz: 1_766_000_000
    use: >
      Licensed to weather satellites sending down full-resolution pictures
      around 1690 MHz, and above 1710 MHz to mobile phone handsets talking
      back to the network.
