# United States band plan.
#
# This file has two jobs, and the second one is the reason it is data rather
# than code. It labels the ribbon above the spectrum, and it gives the
# classifier its prior - "this is where FM broadcast lives, and stations there
# are 200 kHz wide". A second region is a second file, not a second code path.
#
# `description` is shown verbatim to a beginner in the "What is this?"
# expander, so it must read as plain English with no acronyms left cold.

bands:
  - name: AM Radio
    scan: true
    start_hz: 530_000
    end_hz: 1_700_000
    mode: am
    bandwidth_hz: 10_000
    raster_hz: 10_000
    raster_base_hz: 540_000
    # A 2.4 MHz window at the bottom of this band reaches below 0 Hz, where
    # the upconverter's oscillator leak swamps the 8-bit ADC and forces the
    # gain to its floor. Measured at 710 kHz: 36 dB more audio at this rate.
    sample_rate_hz: 240_000
    continuous: true
    icon: radio
    colour: "#c9793a"
    description: >
      Ordinary AM radio stations. These travel a long way at night, when the
      signal bounces off the upper atmosphere, so you may hear places
      hundreds of miles away.

  - name: Shortwave
    start_hz: 2_300_000
    end_hz: 26_100_000
    mode: am
    bandwidth_hz: 10_000
    icon: globe
    colour: "#a4643a"
    description: >
      International broadcasts and long-distance stations. Signals here can
      cross oceans by bouncing between the ground and the upper atmosphere.

