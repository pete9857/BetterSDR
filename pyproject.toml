[project]
name = "bettersdr"
version = "0.1.0"
description = "A beginner-friendly SDR receiver for the RTL-SDR Blog V4"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY.md"]
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "PySide6>=6.10",
    "pyqtgraph>=0.13.7",
    "sounddevice>=0.5.2",
    "PyYAML>=6.0",
    # Repro-Radio writes MP3 rather than WAV: an unattended session runs for
    # hours and fills a music folder, so it has to be small enough to leave
    # going overnight and playable on anything without being told how. Both
    # are ordinary PyPI wheels - a 157 KB statically built LAME and a pure
    # Python tag library - which keeps the property the packaging phase turned
    # on: nothing on the install path is a new unsigned binary.
    "lameenc>=1.8",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Building the packaged application. Not needed to run it from source,
# and deliberately not in `dev`: a test run should not require it.
build = ["pyinstaller>=6.16"]

[project.scripts]
bettersdr = "bettersdr.app:main"
bettersdr-tools = "bettersdr.diagnose:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bettersdr*"]

[tool.setuptools.package-data]
bettersdr = [
    "scan/bandplan/*.yaml",
    "ui/basemap/*.bsm",
    "ui/learn/*.yaml",
    "ui/assets/*.ico",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
